<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arsip Karakter Cerita</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#1f2937;
      --text:#f8fafc;
      --muted:#94a3b8;
      --accent:#7c3aed;
      --accent2:#a78bfa;
      --danger:#ef4444;
      --border:#334155;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#0f172a,#111827 55%,#1e1b4b);
      color:var(--text);
      min-height:100vh;
    }
    header{
      padding:28px 20px 14px;
      text-align:center;
    }
    header h1{margin:0 0 8px;font-size:32px}
    header p{margin:0;color:var(--muted)}
    .wrap{
      width:min(1150px,94%);
      margin:0 auto 50px;
      display:grid;
      grid-template-columns:360px 1fr;
      gap:22px;
    }
    .panel{
      background:rgba(17,24,39,.94);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:0 12px 35px rgba(0,0,0,.25);
    }
    label{
      display:block;
      font-size:13px;
      color:#cbd5e1;
      margin:12px 0 6px;
    }
    input,textarea,select{
      width:100%;
      background:#0b1220;
      color:white;
      border:1px solid var(--border);
      border-radius:10px;
      padding:10px 11px;
      outline:none;
    }
    textarea{min-height:95px;resize:vertical}
    input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
    .btn{
      width:100%;
      margin-top:15px;
      padding:12px 14px;
      border:0;
      border-radius:11px;
      cursor:pointer;
      background:var(--accent);
      color:white;
      font-weight:700;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.secondary{background:#334155}
    .topbar{
      display:flex;
      gap:10px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .topbar input{flex:1;min-width:220px}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:15px;
    }
    .card{
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:15px;
      background:#0b1220;
    }
    .card img{
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      background:#1f2937;
      display:block;
    }
    .card .content{padding:13px}
    .card h3{margin:0 0 4px}
    .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
    .desc{font-size:13px;line-height:1.45;color:#dbeafe}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
    .tag{
      font-size:11px;
      padding:5px 8px;
      border-radius:999px;
      background:#312e81;
      color:#ddd6fe;
    }
    .actions{
      display:flex;
      gap:7px;
      margin-top:12px;
    }
    .actions button{
      flex:1;
      border:0;
      border-radius:8px;
      padding:8px;
      cursor:pointer;
      color:white;
      background:#334155;
    }
    .actions .delete{background:#7f1d1d}
    .empty{
      text-align:center;
      color:var(--muted);
      padding:45px 10px;
      border:1px dashed var(--border);
      border-radius:15px;
    }
    .preview{
      width:100%;
      aspect-ratio:4/3;
      object-fit:cover;
      border-radius:12px;
      border:1px solid var(--border);
      margin-top:10px;
      display:none;
      background:#111827;
    }
    @media(max-width:820px){
      .wrap{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <h1>Arsip Karakter Cerita</h1>
    <p>Simpan foto dan karakteristik tokoh cerita Anda dalam satu tempat.</p>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2 style="margin-top:0">Tambah Karakter</h2>

      <label>Foto Karakter</label>
      <input type="file" id="photo" accept="image/*">
      <img id="preview" class="preview" alt="Preview karakter">

      <label>Nama Karakter</label>
      <input id="name" placeholder="Contoh: Arul">

      <label>Peran</label>
      <input id="role" placeholder="Contoh: Tokoh utama / anggota Dark Knight">

      <label>Umur</label>
      <input id="age" placeholder="Contoh: 17 tahun">

      <label>Tinggi Badan</label>
      <input id="height" placeholder="Contoh: 170 cm">

      <label>Warna / Gaya Rambut</label>
      <input id="hair" placeholder="Contoh: Hitam, bangs dengan ponytail">

      <label>Warna Mata</label>
      <input id="eyes" placeholder="Contoh: Merah">

      <label>Kekuatan / Senjata</label>
      <input id="power" placeholder="Contoh: Pedang kegelapan">

      <label>Kelompok / Organisasi</label>
      <input id="group" placeholder="Contoh: Dark Knight">

      <label>Kota / Tempat Tinggal</label>
      <input id="city" placeholder="Contoh: Kota Pohon Beringin">

      <label>Deskripsi Karakter</label>
      <textarea id="description" placeholder="Tuliskan sifat, latar belakang, hubungan dengan karakter lain, dan sebagainya."></textarea>

      <button class="btn" id="saveBtn">Simpan Karakter</button>
      <button class="btn secondary" id="clearBtn" type="button">Kosongkan Form</button>
    </section>

    <section class="panel">
      <div class="topbar">
        <input id="search" placeholder="Cari nama, kelompok, kota, atau kekuatan...">
        <button class="btn secondary" id="exportBtn" style="width:auto;margin:0">Export Data</button>
        <button class="btn secondary" id="importBtn" style="width:auto;margin:0">Import Data</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>

      <div id="cards" class="grid"></div>
      <div id="empty" class="empty">Belum ada karakter. Tambahkan karakter pertama Anda.</div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const fields = ["name","role","age","height","hair","eyes","power","group","city","description"];
    let photoData = "";
    let editingId = null;
    let characters = JSON.parse(localStorage.getItem("storyCharacters") || "[]");

    $("photo").addEventListener("change", e => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        photoData = reader.result;
        $("preview").src = photoData;
        $("preview").style.display = "block";
      };
      reader.readAsDataURL(file);
    });

    function getFormData(){
      const obj = {};
      fields.forEach(f => obj[f] = $(f).value.trim());
      obj.photo = photoData;
      return obj;
    }

    function clearForm(){
      fields.forEach(f => $(f).value = "");
      $("photo").value = "";
      $("preview").style.display = "none";
      $("preview").src = "";
      photoData = "";
      editingId = null;
      $("saveBtn").textContent = "Simpan Karakter";
    }

    function saveData(){
      localStorage.setItem("storyCharacters", JSON.stringify(characters));
    }

    $("saveBtn").addEventListener("click", () => {
      const data = getFormData();
      if(!data.name){
        alert("Nama karakter wajib diisi.");
        return;
      }

      if(editingId){
        characters = characters.map(c => c.id === editingId ? {...data, id:editingId} : c);
      }else{
        characters.unshift({...data, id:Date.now()});
      }
      saveData();
      clearForm();
      render();
    });

    $("clearBtn").addEventListener("click", clearForm);
    $("search").addEventListener("input", render);

    function escapeHTML(str=""){
      return str.replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function render(){
      const q = $("search").value.toLowerCase();
      const filtered = characters.filter(c =>
        Object.values(c).join(" ").toLowerCase().includes(q)
      );

      $("cards").innerHTML = "";
      $("empty").style.display = filtered.length ? "none" : "block";

      filtered.forEach(c => {
        const div = document.createElement("article");
        div.className = "card";
        const img = c.photo
          ? `<img src="${c.photo}" alt="${escapeHTML(c.name)}">`
          : `<div style="aspect-ratio:4/3;display:grid;place-items:center;background:#1f2937;color:#94a3b8">Tanpa Foto</div>`;

        div.innerHTML = `
          ${img}
          <div class="content">
            <h3>${escapeHTML(c.name)}</h3>
            <div class="meta">${escapeHTML(c.role || "Belum ada peran")}</div>
            <div class="desc">${escapeHTML(c.description || "Belum ada deskripsi.")}</div>
            <div class="tags">
              ${c.power ? `<span class="tag">${escapeHTML(c.power)}</span>` : ""}
              ${c.group ? `<span class="tag">${escapeHTML(c.group)}</span>` : ""}
              ${c.city ? `<span class="tag">${escapeHTML(c.city)}</span>` : ""}
            </div>
            <div style="font-size:12px;color:#cbd5e1;margin-top:10px;line-height:1.5">
              ${c.age ? `Umur: ${escapeHTML(c.age)}<br>` : ""}
              ${c.height ? `Tinggi: ${escapeHTML(c.height)}<br>` : ""}
              ${c.hair ? `Rambut: ${escapeHTML(c.hair)}<br>` : ""}
              ${c.eyes ? `Mata: ${escapeHTML(c.eyes)}` : ""}
            </div>
            <div class="actions">
              <button onclick="editCharacter(${c.id})">Edit</button>
              <button class="delete" onclick="deleteCharacter(${c.id})">Hapus</button>
            </div>
          </div>
        `;
        $("cards").appendChild(div);
      });
    }

    window.editCharacter = function(id){
      const c = characters.find(x => x.id === id);
      if(!c) return;
      fields.forEach(f => $(f).value = c[f] || "");
      photoData = c.photo || "";
      editingId = id;
      if(photoData){
        $("preview").src = photoData;
        $("preview").style.display = "block";
      }else{
        $("preview").style.display = "none";
      }
      $("saveBtn").textContent = "Update Karakter";
      window.scrollTo({top:0,behavior:"smooth"});
    }

    window.deleteCharacter = function(id){
      if(!confirm("Hapus karakter ini?")) return;
      characters = characters.filter(c => c.id !== id);
      saveData();
      render();
    }

    $("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(characters,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "data-karakter-cerita.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", e => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const data = JSON.parse(reader.result);
          if(!Array.isArray(data)) throw new Error();
          characters = data;
          saveData();
          render();
          alert("Data berhasil diimport.");
        }catch{
          alert("File JSON tidak valid.");
        }
      };
      reader.readAsText(file);
    });

    render();
  </script>
</body>
</html>
